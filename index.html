<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Story ❤️</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,600;0,800;0,900;1,600&family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="petals" id="petals"></div>

<!-- save indicator (top-left) -->
<div class="save-pill hidden" id="savePill">Ready</div>

<!-- edit toggle (bottom-right, hidden until enabled) -->
<button class="edit-toggle hidden" id="editToggle" title="Edit">✎</button>

<!-- edit toolbar -->
<div class="edit-toolbar" id="editToolbar">
  <div class="et-left"><span class="et-label">EDITING · changes commit to GitHub</span></div>
  <div class="et-right">
    <button class="et-btn" id="etAddMoment">+ Moment</button>
    <button class="et-btn" id="etAddPhoto">+ Photo</button>
    <button class="et-btn" id="etChangeMusic">♪ Music</button>
    <button class="et-btn et-done" id="etDone">Save & Done</button>
  </div>
</div>

<!-- hidden file inputs -->
<input type="file" id="imgInput" accept="image/*" multiple hidden>
<input type="file" id="musicInput" accept="audio/*" hidden>

<!-- loader -->
<div id="loader" class="loader">
  <div class="loader-heart">❤</div>
  <p class="loader-text">Loading our story…</p>
</div>

<!-- music player -->
<div class="music-player hidden" id="musicPlayer">
  <button class="music-btn" id="musicBtn" title="Play our song">
    <svg class="music-icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <svg class="music-icon-pause hidden" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
  </button>
  <div class="music-info">
    <p class="music-title" id="musicTitle">Our song</p>
    <div class="music-bars"><span></span><span></span><span></span><span></span></div>
  </div>
</div>

<!-- HERO -->
<section class="hero">
  <div class="hero-glow"></div>
  <div class="hero-content">
    <p class="hero-sub editable" data-key="heroSub"></p>
    <h1 class="hero-title editable" data-key="heroTitle"></h1>
    <p class="hero-names">
      <span class="name editable" data-key="yourName"></span>
      <span class="amp">&amp;</span>
      <span class="name editable" data-key="herName"></span>
    </p>
    <p class="hero-date editable" data-key="startDateLabel"></p>
    <button class="hero-btn" id="startBtn">
      <span>Begin our journey</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
    </button>
  </div>
  <div class="scroll-hint">scroll ↓</div>
</section>

<!-- QUOTE -->
<section class="quote-strip">
  <p class="quote editable" data-key="quote"></p>
</section>

<!-- TIMELINE -->
<section class="timeline-section">
  <h2 class="section-title editable" data-key="timelineTitle"></h2>
  <p class="section-sub editable" data-key="timelineSub"></p>
  <div class="timeline" id="timeline"></div>
  <div class="add-row" data-edit-only><button class="add-btn" onclick="addMoment()">+ Add a moment</button></div>
</section>

<!-- PARALLAX -->
<section class="parallax-band">
  <div class="parallax-inner"><p class="parallax-text editable" data-key="parallaxText"></p></div>
</section>

<!-- GALLERY -->
<section class="gallery-section">
  <h2 class="section-title editable" data-key="galleryTitle"></h2>
  <div class="gallery" id="gallery"></div>
  <div class="add-row" data-edit-only><button class="add-btn" onclick="addPhotosFromInput()">+ Add photos</button></div>
</section>

<!-- LETTER -->
<section class="letter-section">
  <div class="letter">
    <div class="letter-paper">
      <div class="letter-wax">❤</div>
      <p class="letter-greeting editable" data-key="letterGreeting"></p>
      <div class="letter-body" id="letterBody"></div>
      <p class="letter-signature editable" data-key="letterSignature"></p>
    </div>
  </div>
</section>

<!-- COUNTER -->
<section class="counter-section">
  <p class="counter-label editable" data-key="counterLabel"></p>
  <div class="counter">
    <div class="counter-item"><span class="counter-num" id="days">0</span><span class="counter-lbl">Days</span></div>
    <div class="counter-item"><span class="counter-num" id="hours">0</span><span class="counter-lbl">Hours</span></div>
    <div class="counter-item"><span class="counter-num" id="minutes">0</span><span class="counter-lbl">Minutes</span></div>
    <div class="counter-item"><span class="counter-num" id="seconds">0</span><span class="counter-lbl">Seconds</span></div>
  </div>

    <div class="milestone-section">
    <p class="milestone-label">Next milestone</p>
    <div id="milestones" class="milestones"></div>
  </div>
  
</section>

<!-- FINAL -->
<section class="final-section">
  <div class="final-content">
    <div class="final-heart">❤</div>
    <h2 class="final-title editable" data-key="finalTitle"></h2>
    <p class="final-text editable" data-key="finalText"></p>
    <button class="final-btn" id="heartBtn"><span>Click for a surprise</span></button>
  </div>
</section>

<footer class="site-footer">
  <p>Made with <span class="heart">❤</span> just for you</p>
</footer>

<audio id="bgMusic" loop></audio>
<div class="lightbox" id="lightbox"><img src="" alt=""></div>
<div id="heartRain" class="heart-rain"></div>
<div id="toast" class="toast hidden"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
